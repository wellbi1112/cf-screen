<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클럽 페어웨이 스크린 투어</title>
<meta name="description" content="클럽 페어웨이 스크린대회 요강, 참가 신청, 라이브 기록과 최종 순위">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  #app{padding-bottom:24px}
  .loading{padding:40px 10px;text-align:center;color:var(--muted)}
  .loading .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:0 auto 10px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .updated{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-top:14px}
  .updated button{border:0;background:transparent;color:var(--green);cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px}
  .past{margin-top:26px}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="logo" href="./">
      <img class="badge" src="img/logo.png" alt="클럽 페어웨이 엠블럼">
      <div class="logotype"><div class="top">CLUB</div><div class="big">FAIRWAY</div><div class="slogan">실력보다 태도, 스코어보다 사람</div></div>
    </a>
    <div class="tourtag">SCREEN<br>TOUR</div>
  </header>
  <main id="view"><div class="loading"><div class="spin"></div>대회 정보를 불러오는 중…</div></main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const C = window.CF; const view = document.getElementById('view');
  async function render(){
    let S;
    try{ S = await C.loadData(); }
    catch(err){ view.innerHTML = `<div class="empty illus">${C.EMPTY_SVG}대회 정보를 불러오지 못했습니다.<br><span class="sub">잠시 후 다시 열어 주세요.</span></div>` + C.footerHtml(); return; }
    const e = C.currentEvent(S);
    const parts = [C.heroHtml(S,e)];
    if(e && e.status !== '종료') parts.push(`<section><div class="sec-head"><h2>${C.ic('trophy')}<span class="pill live" style="margin-right:2px">LIVE</span> 등급별 현재 순위</h2><span class="meta">${C.roundsOf(S,e).length} 라운드 · ${C.liveRows(S,e).length}명</span></div>${C.liveSummaryHtml(S,e)}</section><section><div class="sec-head"><h2>${C.ic('star')}기록 부문</h2><span class="meta">운영진 수시 갱신</span></div>${C.recordsHtml(S,e)}</section>`);
    if(e){
      parts.push(`<section><div class="sec-head"><h2>${C.ic('users')}참가자</h2><span class="meta">${C.entriesOf(S,e).length}명 접수${C.entryOpen(e)?' · 접수 중':''}</span></div>${C.participantsHtml(S,e)}</section>`);
      if(e.status !== '종료'){
        parts.push(`<section><div class="sec-head"><h2>${C.ic('users')}참여 현황</h2><span class="meta">${C.roundsOf(S,e).length} 라운드 · ${C.roundStats(S,e).length}명</span></div>${C.participationHtml(S,e)}</section>`);
      }
      if(e.status === '종료' || C.scoresOf(S,e).length){
        parts.push(`<section><div class="sec-head"><h2>${C.ic('trophy')}등급별 최종 순위</h2><span class="meta">골프존 대회 통계 기준</span></div>${C.boardHtml(S,e)}</section>`);
        const pz = C.prizesHtml(S,e); if(pz) parts.push(`<section><div class="sec-head"><h2>${C.ic('star')}시상</h2></div>${pz}</section>`);
        if(e.status === '종료' && C.roundsOf(S,e).length) parts.push(`<section><div class="sec-head"><h2>${C.ic('users')}참여 현황</h2><span class="meta">${C.roundsOf(S,e).length} 라운드</span></div>${C.participationHtml(S,e)}</section>`);
      }
    }
    const past = S.events.filter(x => x.status==='종료' && (!e || x.id !== e.id)).sort((a,b)=>b.date.localeCompare(a.date));
    if(past.length){
      parts.push(`<section class="past"><div class="sec-head"><h2>${C.ic('flag')}지난 대회</h2><span class="meta">${C.CFG.season} 시즌</span></div><div class="list">${past.map(x => { const top = C.board(S,x).slice(0,3); return `<details class="item"><summary>${C.esc(x.title)} <span class="sub">${C.period(x)}</span></summary><div class="chips" style="margin-bottom:10px">${top.map(r => `<span class="tag ${r.rank===1?'gold':''}">${r.rank}위 ${C.esc(r.dname)} ${r.net}</span>`).join('')}</div>${C.boardHtml(S,x)}${C.prizesHtml(S,x)}</details>`; }).join('')}</div></section>`);
    }
    if(e && C.sponsorsHtml(S,e)) parts.push(`<section><div class="sec-head"><h2>${C.ic('gift')}협찬품</h2></div>${C.sponsorsHtml(S,e)}</section>`);
    parts.push(`<div class="updated"><span>${new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} 기준${S.errors.length?` · 일부 탭을 읽지 못함(${S.errors.join(', ')})`:''}</span><button id="reload">${C.ic('refresh')}새로고침</button></div>`);
    parts.push(C.footerHtml());
    view.innerHTML = parts.join('');
    document.getElementById('reload').onclick = () => { view.innerHTML = '<div class="loading"><div class="spin"></div>불러오는 중…</div>'; render(); };
    if(location.hash === '#apply'){ const a = document.getElementById('apply'); if(a) a.scrollIntoView({block:'center'}); }
  }
  render();
})();
</script>
</body>
</html>
